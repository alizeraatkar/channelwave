name: Desktop packages
on:
  workflow_call:
    inputs:
      sha: { type: string, required: true }
      version: { type: string, required: true }
      build-number: { type: string, required: true }
      windows: { type: boolean, required: true }
      linux: { type: boolean, required: true }
    secrets:
      TELEGRAM_API_ID: { required: true }
      TELEGRAM_API_HASH: { required: true }
permissions:
  contents: read
jobs:
  package:
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows, os: windows-2025, enabled: '${{ inputs.windows }}' }
          - { platform: linux, os: ubuntu-24.04, enabled: '${{ inputs.linux }}' }
    runs-on: ${{ matrix.os }}
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.tools/nuget-application
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: matrix.enabled
        with: { ref: '${{ inputs.sha }}', persist-credentials: false }
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        if: matrix.enabled
        with: { global-json-file: global.json }
      - name: Native cache
        if: matrix.enabled
        id: native
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: artifacts/tdlib/${{ matrix.platform }}
          key: tdlib-${{ matrix.platform }}-v2-${{ hashFiles('vendor/tdlib.lock.json', '.github/release.json', 'scripts/build-tdlib-windows.ps1', 'scripts/build-tdlib-apple.sh', 'scripts/tdlib-linux.Dockerfile', 'scripts/verify-native.py') }}
      - name: Linux dependencies
        if: matrix.enabled && matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libnotify4 libgtk-3-0t64 libwebkit2gtk-4.1-0 libvlc5 vlc-plugin-base libsecret-tools xvfb dbus-x11 gnome-keyring
      - name: Pinned Linux TDLib
        if: matrix.enabled && matrix.platform == 'linux' && steps.native.outputs.cache-hit != 'true'
        run: docker build -f scripts/tdlib-linux.Dockerfile --target artifact --output type=local,dest=artifacts/tdlib/linux .
      - name: Pinned Windows TDLib
        if: matrix.enabled && matrix.platform == 'windows' && steps.native.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/build-tdlib-windows.ps1
      - name: Verify native libraries before caching
        if: matrix.enabled
        run: python scripts/verify-native.py artifacts/tdlib/${{ matrix.platform }} ${{ matrix.platform }}
      - name: Save verified native libraries
        if: matrix.enabled && steps.native.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: artifacts/tdlib/${{ matrix.platform }}
          key: ${{ steps.native.outputs.cache-primary-key }}
      - name: Install Windows workload
        if: matrix.enabled && matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/install-workloads.ps1 -Workloads maui-windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: matrix.enabled
        with: { name: reservation, path: artifacts }
      - name: Application registration
        if: matrix.enabled
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: python scripts/prepare-telegram.py ${{ matrix.platform == 'windows' && 'src/ChannelWave.Host.Maui/Resources/Raw/telegram.json' || 'artifacts/telegram.json' }}
      - name: Build and verify package
        if: matrix.enabled
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD_NUMBER: ${{ inputs.build-number }}
        run: ./scripts/package-desktop.ps1 -Platform '${{ matrix.platform }}' -Version $env:RELEASE_VERSION -BuildNumber $env:RELEASE_BUILD_NUMBER
      - name: Provision hosted Windows audio
        if: matrix.enabled && matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/setup-windows-ci-audio.ps1
      - name: Native startup smoke
        if: matrix.enabled
        shell: pwsh
        run: ./scripts/smoke-desktop.ps1 -Platform '${{ matrix.platform }}'
      - name: Remove temporary configuration
        if: always() && matrix.enabled
        shell: pwsh
        run: |
          if (Test-Path artifacts/telegram.json) { Remove-Item -LiteralPath artifacts/telegram.json }
          git restore -- src/ChannelWave.Host.Maui/Resources/Raw/telegram.json
      - name: Sanitized native diagnostics
        if: always() && matrix.enabled
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-diagnostics-${{ matrix.platform }}-${{ github.run_attempt }}
          path: artifacts/smoke-*.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.enabled
        with:
          name: release-${{ matrix.platform }}
          path: artifacts/release-${{ matrix.platform }}/*
          if-no-files-found: error
          overwrite: true
          retention-days: 30
